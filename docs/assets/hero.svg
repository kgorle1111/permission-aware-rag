<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Permission-aware RAG: one document archive flows through a permission check that runs before ranking; a junior underwriter sees 3 of 6 files, a senior 5 of 6, compliance 4 of 6. Measured: 0 leaks in 1,350 probes, 6 of 6 planted leak bugs caught, enforced in Postgres row-level security too.">
