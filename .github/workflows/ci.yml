name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (setup-uv has no moving major tags since v8)
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra pg   # psycopg only so mypy can resolve pgvector_rag imports
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy   # strict, except the modules listed in the pyproject.toml ratchet
      - run: uv run pytest -q --cov=. --cov-config=../pyproject.toml --cov-fail-under=75   # measured 75.58% without Postgres
        working-directory: app
      - run: uv run python run_evals.py   # leak gate: exits 1 on any ACL leak or recall miss
        working-directory: app
      - run: uv run python run_evals.py --mutants   # the gate must catch every known-leaky retriever
        working-directory: app
      - run: uv run python ../evals/ladder.py --check   # baseline accepted, every negative-control rung rejected
        working-directory: app

  pgvector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest "psycopg[binary]"
      - run: pytest test_pgvector.py -q   # RLS leak gate over the pgvector backend
        working-directory: app
      # scaled eval needs an empty corpus: fresh database, not the one pytest just filled
      - run: python -c "import psycopg; psycopg.connect('${{ env.DATABASE_URL }}', autocommit=True).execute('CREATE DATABASE scale_eval')"
      - run: python eval_scale.py --pgvector   # 1,350 must-not probes under RLS
        working-directory: app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scale_eval

  audit:
    # known-vulnerability gate over every dependency set we ship or test with, plus a CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (setup-uv has no moving major tags since v8)
        with:
          python-version: "3.12"
      - run: uv export --locked --group dev --extra pg --no-hashes > root-requirements.txt
      # Everything we ship or test with, no exceptions; this is also the SBOM.
      - run: >-
          uvx pip-audit==2.10.1
          -r root-requirements.txt
          -r platform/requirements.txt -r platform/requirements-dev.txt
          -r platform/requirements-pdf.txt
          --format cyclonedx-json -o sbom.cdx.json
      # The optional local-models extra resolves on its own; upstream pins there may need a dated exception
      # (.github/pip-audit-exceptions.json). An expired exception fails the build.
      - name: Audit the optional models extra
        run: |
          args=$(python3 - <<'PY'
          import datetime, json, sys
          exc = json.load(open(".github/pip-audit-exceptions.json"))["exceptions"]
          expired = [e["id"] for e in exc if datetime.date.fromisoformat(e["expires"]) < datetime.date.today()]
          if expired:
              sys.exit(f"pip-audit exceptions expired, re-check upstream and renew or remove: {expired}")
          print(" ".join(f"--ignore-vuln {e['id']}" for e in exc))
          PY
          )
          uvx pip-audit==2.10.1 -r platform/requirements-models.txt $args
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
