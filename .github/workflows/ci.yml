name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        working-directory: app
      - run: python run_evals.py   # leak gate: exits 1 on any ACL leak or recall miss
        working-directory: app
      - run: python run_evals.py --mutants   # the gate must catch every known-leaky retriever
        working-directory: app
      - run: python ../evals/ladder.py --check   # baseline accepted, every negative-control rung rejected
        working-directory: app

  pgvector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "psycopg[binary]"
      - run: pytest test_pgvector.py -q   # RLS leak gate over the pgvector backend
        working-directory: app
      # scaled eval needs an empty corpus: fresh database, not the one pytest just filled
      - run: python -c "import psycopg; psycopg.connect('${{ env.DATABASE_URL }}', autocommit=True).execute('CREATE DATABASE scale_eval')"
      - run: python eval_scale.py --pgvector   # 1,350 must-not probes under RLS
        working-directory: app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scale_eval
