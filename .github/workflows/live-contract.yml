name: live-contract

# Weekly check that our two real-model call sites (app/llm.py, platform/app/generation.py) still
# match the live Anthropic Messages API. schedule + workflow_dispatch only: never push or
# pull_request, so fork PRs cannot reach the secret.
# Cost: 2 calls/run, ~450 input + <=64 output tokens each at Haiku 4.5 prices ($1/M in, $5/M out)
# = about $0.0016/run, about $0.008/month. Needs the repo secret ANTHROPIC_API_KEY; fails (red) without it.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fails rather than skips: a green run without the key tested nothing. Only schedule and
      # workflow_dispatch trigger this workflow, so there is no fork/PR context where skipping is right.
      - name: Require the ANTHROPIC_API_KEY secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repo secret is not set, so the live contract cannot run. Fix: gh secret set ANTHROPIC_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt
      - run: python -m pip install -r platform/requirements-dev.txt
      - name: Reference app (urllib client)
        working-directory: app
        run: python -m pytest test_live_contract.py -q -s
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_LIVE_CONTRACT: "1"
      - name: Platform (httpx client)
        working-directory: platform
        run: python -m pytest tests/test_live_contract.py -q -s
        env:
          LIVE_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # conftest blanks ANTHROPIC_API_KEY
          RUN_LIVE_CONTRACT: "1"
